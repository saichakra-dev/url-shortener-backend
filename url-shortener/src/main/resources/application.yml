spring:
  application:
    name: url-shortener

  # Active profile — override with env var in production:
  # SPRING_PROFILES_ACTIVE=prod
  profiles:
    active: local

  data:
    mongodb:
      uri: mongodb://admin:password@localhost:27017/urlshortener?authSource=admin
      database: urlshortener

    redis:
      host: localhost
      port: 6379
      password: password
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: url-shortener-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.urlshortener.*"

server:
  port: 8080

# Actuator — expose health endpoint
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

# App-level config (we'll add JWT secret here later)
app:
  jwt:
    secret: "placeholder-will-replace-with-real-secret-in-day2"
    expiration-ms: 86400000   # 24 hours

logging:
  level:
    com.urlshortener: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"