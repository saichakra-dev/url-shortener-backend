version: '3.8'

# A "network" lets our containers talk to each other by service name.
# Our Spring Boot app will connect to "mongodb", "redis", "kafka" —
# not localhost — because they're separate containers on this network.
networks:
  urlshortener-network:
    driver: bridge

# Volumes persist data when containers restart.
# Without this, every "docker-compose down" would wipe your MongoDB data.
volumes:
  mongodb-data:
  redis-data:

services:

  # ─── MongoDB ────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: urlshortener-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"      # host:container
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: urlshortener
    volumes:
      - mongodb-data:/data/db    # named volume → data persists
    networks:
      - urlshortener-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine        # alpine = smaller image
    container_name: urlshortener-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass password --maxmemory 256mb --maxmemory-policy allkeys-lru
    # maxmemory-policy: when Redis is full, evict least-recently-used keys
    # This is important for a cache — you want LRU eviction
    volumes:
      - redis-data:/data
    networks:
      - urlshortener-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Zookeeper (required by Kafka) ──────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: urlshortener-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - urlshortener-network

  # ─── Kafka ──────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: urlshortener-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper               # Kafka won't start before Zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners:
      # PLAINTEXT      → used by OTHER CONTAINERS (Spring Boot app)
      # PLAINTEXT_HOST → used by YOUR MACHINE (for local tooling/testing)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - urlshortener-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Mongo Express (MongoDB UI — dev only) ──────────────────
  mongo-express:
    image: mongo-express:1.0.2
    container_name: urlshortener-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongodb:
        condition: service_healthy   # waits for MongoDB healthcheck to pass
    networks:
      - urlshortener-network